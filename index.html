<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MamPhem Exam Simulator</title>
</head>
<body>
    <h2 id="question">Loading...</h2>
    <div id="options"></div>
    <div id="feedback"></div>

    <script>
        console.log("Script starting...");
        
        const questionBank = {
            paper1: [
                { t:"5.1", d:1, q: "Simplify: 3x + 5y + 2x − y", a: ["5x + 4y", "5x − 4y", "5x + 6y", "1x + 4y"], c: 2, fb: "Collect x-terms and y-terms separately." }
            ],
            paper2: [
                { t:"5.1", d:1, q: "Expand and simplify: 2(3x + 4) − 3(x − 2). Show all working. [3 marks]", a: "2(3x+4)−3(x−2) = 6x+8−3x+6 = 3x+14", fb: "Watch the signs." }
            ]
        };

        const allQuestions = [...questionBank.paper1, ...questionBank.paper2];
        console.log("Total questions loaded: " + allQuestions.length);
        let i = 0;

        function loadQ() {
            console.log("Loading question index: " + i);
            if (i >= allQuestions.length) {
                document.getElementById('question').innerText = "Practice Complete!";
                return;
            }
            
            const qObj = allQuestions[i];
            document.getElementById('question').innerText = qObj.q;
            
            // If this line crashes, the error will finally show in the Console
            try {
                // ... (your existing logic here)
            } catch(e) {
                console.error("Error loading question: ", e);
            }
        }
        
        loadQ();
        console.log("Script finished.");
    </script>
</body>
</html>
