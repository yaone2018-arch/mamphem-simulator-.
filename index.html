<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MamPhem Exam Simulator</title>
    <style>
        body { font-family: 'Helvetica', sans-serif; background: #f4f4f4; padding: 20px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header { background: #003366; color: #C5A059; padding: 15px; text-align: center; border-radius: 8px 8px 0 0; }
        .option { display: block; margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .option:hover { background: #eef; border-color: #003366; }
        #feedback { font-weight: bold; margin-top: 15px; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header"><h2>MamPhem Exam Simulator</h2></div>
        <div id="quiz">
            <p id="question">Loading question...</p>
            <div id="options"></div>
            <div id="feedback"></div>
        </div>
    </div>

    <script>
        const questions = [
            { t: "5.1", q: "Simplify: 5x + 3y - 2x + y", a: ["3x + 4y", "7x + 2y", "3x + 2y", "6x+4y"], c: 0, fb: "Collect like terms: (5x-2x) + (3y+y)" },
            { t: "5.2", q: "Solve for x: 2(x+3) = 10", a: ["x=2", "x=4", "x=5", "x=3"], c: 0, fb: "Expand: 2x + 6 = 10 -> 2x = 4 -> x = 2" },
            { t: "5.3", q: "Solve: -2x > 6", a: ["x > -3", "x < -3", "x > 3", "x < 3"], c: 1, fb: "Remember: Dividing by a negative flips the sign." }
        ];

        function loadQuestion(i) {
            document.getElementById('question').innerText = questions[i].q;
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            questions[i].a.forEach((opt, idx) => {
                let btn = document.createElement('div');
                btn.className = 'option';
                btn.innerText = opt;
                btn.onclick = () => check(idx, questions[i].c, questions[i].fb);
                optDiv.appendChild(btn);
            });
        }

        function check(sel, cor, fb) {
            const feed = document.getElementById('feedback');
            feed.innerText = (sel === cor) ? "Correct! [A1]" : "Try again: " + fb;
            feed.style.background = (sel === cor) ? "#d4edda" : "#f8d7da";
        }
        loadQuestion(0);
    </script>
</body>
</html>
