<script>
    const questions = [
        // ... (Keep your full 100-question list here)
        { t: "5.1", q: "Simplify: 5x + 3y - 2x + y", a: ["3x + 4y", "7x + 2y", "3x + 2y", "6x+4y"], c: 0, fb: "Collect like terms!" },
        { t: "5.2", q: "Solve for x: 2(x+3) = 10", a: ["x=2", "x=4", "x=5", "x=3"], c: 0, fb: "Expand first: 2x+6=10" }
    ];

    let currentIndex = 0;

    function loadQuestion(i) {
        if (i >= questions.length) {
            document.getElementById('quiz').innerHTML = "<h2>Practice Complete!</h2>";
            return;
        }
        document.getElementById('question').innerText = questions[i].q;
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        questions[i].a.forEach((opt, idx) => {
            let btn = document.createElement('div');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => check(idx, questions[i].c, questions[i].fb);
            optDiv.appendChild(btn);
        });
    }

    function check(sel, cor, fb) {
        const feed = document.getElementById('feedback');
        feed.innerText = (sel === cor) ? "Correct! [A1]" : "Try again: " + fb;
        feed.style.background = (sel === cor) ? "#d4edda" : "#f8d7da";
        
        // Add a "Next" button after answering
        let nextBtn = document.createElement('button');
        nextBtn.innerText = "Next Question";
        nextBtn.className = "option";
        nextBtn.onclick = () => {
            currentIndex++;
            loadQuestion(currentIndex);
            feed.innerText = "";
            feed.style.background = "none";
        };
        document.getElementById('options').appendChild(nextBtn);
    }
    
    loadQuestion(0);
</script>
